<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007bff">
<meta name="color-scheme" content="light dark">
<script src="/auth/theme.js"></script>
<link rel="icon" href="/auth/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/auth/apple-touch-icon.png">
<title>Verification code · Dive Manager</title>
<style>
  :root { --blue:#007bff; --bg:#f8f9fa; --text:#212529; --muted:#6c757d; --card:#fff; --line:#ced4da; --red:#c92a2a; }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#16181b; --text:#e9ecef; --muted:#9aa3ab; --card:#212529; --line:#4a5158; --red:#ff8787; }
  .theme-corner { position: fixed; top: 12px; right: 12px; line-height: 0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
  main { width:100%; max-width:380px; }
  h1 { font-size:22px; text-align:center; margin:0 0 4px; }
  .ver { text-align:center; color:var(--muted); font-size:12px; margin-bottom:22px; }
  .card { background:var(--card); border-radius:14px; padding:22px 18px; box-shadow:0 2px 8px rgba(0,0,0,.08); text-align:center; }
  h2 { font-size:17px; margin:0 0 8px; }
  p { color:var(--muted); font-size:14px; line-height:1.45; margin:0 0 18px; }
  .boxes { display:flex; justify-content:center; gap:8px; margin-bottom:6px; }
  .boxes input { width:44px; height:56px; min-width:0; text-align:center; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums;
                 border:1.5px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); padding:0; caret-color:var(--blue); }
  .boxes input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,123,255,.25); }
  .boxes input.filled { border-color:var(--blue); }
  .boxes.bad input { border-color:var(--red); animation:shake .35s; }
  @keyframes shake { 20%,60% { transform:translateX(-4px); } 40%,80% { transform:translateX(4px); } }
  .err { color:var(--red); font-size:14px; min-height:20px; margin:10px 0 8px; }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; border:0; border-radius:10px; background:var(--blue); color:#fff;
         font:600 16px inherit; font-family:inherit; cursor:pointer; touch-action:manipulation; }
  .btn:disabled { opacity:.6; cursor:default; }
  a.back { display:inline-block; margin-top:16px; color:var(--muted); font-size:14px; padding:10px; }
  @media (max-width:340px) { .boxes input { width:38px; height:50px; } .boxes { gap:6px; } }
</style>
</head>
<body>
<div class="theme-corner" data-theme-switch></div>
<main>
  <h1>Dive Manager</h1>
  <div class="ver">v__APP_VERSION__</div>
  <div class="card">
    <h2>Two-step verification</h2>
    <p>Open your authenticator app (for example Google Authenticator) and enter the 6-digit code for Dive Manager.</p>
    <form id="form" novalidate>
      <div id="boxes" class="boxes" role="group" aria-label="6-digit verification code">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1 of 6">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 2 of 6">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 3 of 6">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 4 of 6">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 5 of 6">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 6 of 6">
      </div>
      <div id="err" class="err" role="alert" aria-live="polite"></div>
      <button id="go" class="btn" type="submit">Verify</button>
    </form>
    <a class="back" href="/auth/login">Use a different account</a>
  </div>
</main>
<script src="/auth/mfa.js"></script>
</body>
</html>
