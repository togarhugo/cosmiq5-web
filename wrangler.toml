name = "cosmiq-manager"
main = "src/worker.js"  # the app files in public/ are bundled into the Worker by scripts/build-assets.mjs
compatibility_date = "2025-01-01"

# Serve on your own domain (the zone must be on this Cloudflare account).
routes = [{ pattern = "cosmiq.thmlab.org", custom_domain = true }]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "cosmiq"
database_id = "da3daca5-ced2-46b5-924e-0021b8afb5f3"

[vars]
# Zero Trust > Settings > Custom Pages shows your team name: <team>.cloudflareaccess.com
TEAM_DOMAIN = "thmlab.cloudflareaccess.com"
# Zero Trust > Access > Applications > your app > "Application Audience (AUD) Tag"
POLICY_AUD = "REPLACE_WITH_AUD_TAG"
# Defence in depth: only these Google accounts may use the API.
# Set as a secret instead of committing it:  npx wrangler secret put ALLOWED_EMAILS  (your Google email; comma-separated for several)
